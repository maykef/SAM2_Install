name: sam2
channels:
  - pytorch
  - conda-forge
dependencies:
  # Python core
  - python=3.11
  
  # PyTorch with CUDA 12.8 support (nightly for Blackwell sm_120)
  - pytorch::pytorch=2.10.0.dev*
  - pytorch::pytorch-cuda=12.8
  - pytorch::torchvision
  
  # Core scientific stack
  - numpy>=1.23
  - scipy>=1.10
  - scikit-image>=0.21
  - scikit-learn>=1.3
  - pandas>=2.0
  - matplotlib>=3.7
  
  # Image processing
  - opencv>=4.8
  - pillow>=10.0
  
  # Build and compilation
  - cmake>=3.25
  - ninja>=1.11
  - cxx-compiler
  
  # Git and utilities
  - git
  - curl
  - wget
  
  # pip dependencies (cannot be satisfied by conda)
  - pip

pip:
  # HuggingFace ecosystem
  - transformers>=4.36
  - huggingface_hub>=0.19
  - safetensors>=0.4
  
  # Image models and utilities
  - timm>=0.9  # PyTorch Image Models
  - Pillow>=10.0
  
  # Utilities
  - tqdm>=4.66
  - pyyaml>=6.0
  - omegaconf>=2.3
  
  # Optional: for notebook usage
  - jupyter>=1.0
  - ipython>=8.16
